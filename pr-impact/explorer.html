<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pull request impact explorer</title>
<style>
:root{--ink:#18253b;--muted:#526178;--paper:#f1f4f8;--rule:#d8e0eb;--accent:#15545e;--selected:#e4f3f2;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Instrument Sans",system-ui,sans-serif}
header{background:#16283a;color:#fff;padding:26px max(20px,calc((100% - 1300px)/2))}h1,h2,h3,p{margin:0}h1{font-size:clamp(25px,5vw,38px);letter-spacing:-.04em}h2{font-size:19px}h3{font-size:14px;margin:12px 0 6px}header p{color:#bfd0df}code,pre,.path{font-family:var(--mono)}.path{overflow-wrap:anywhere;font-size:12px}
main{max-width:1340px;margin:auto;padding:20px;display:grid;grid-template-columns:minmax(190px,1fr) minmax(260px,1.55fr) minmax(240px,1.45fr);gap:14px;align-items:start}.panel{min-width:0;background:white;border:1px solid var(--rule);border-radius:12px;padding:15px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;text-align:left;background:#fff;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}button:hover{border-color:var(--accent)}button[aria-current=true]{background:var(--selected);border-color:var(--accent)}:focus-visible{outline:3px solid #257d8a;outline-offset:2px}
.list{display:grid;gap:6px}.list button{width:100%}.stack{max-height:390px;overflow:auto;padding:3px}.package-name{font-weight:700;display:block}.muted,small{color:var(--muted)}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input{width:100%;margin:8px 0;padding:8px 10px;border:1px solid var(--rule);border-radius:7px}select{max-width:100%}.row{margin-top:10px}.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:#e7effb;color:#244d7b}.tag.M,.tag.T{background:#ffedc7;color:#6a4300}.tag.A{background:#d9f3e5;color:#205c40}.tag.D{background:#fbe0e0;color:#8a3033}
pre{overflow:auto;max-height:510px;background:#f5f7fa;padding:10px;border-radius:8px;font-size:12px;tab-size:4}.diff-line{display:block}.add{background:#e0f3e7}.del{background:#fbe1e1}.hunk{color:#245a91}.edge{display:block;border-left:3px solid #5f969b;padding:6px 9px;margin-bottom:6px;background:#f2f7f8}.edge.removed{border-left-style:dashed}.edge button{margin-top:4px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:980px){main{grid-template-columns:minmax(180px,1fr) minmax(240px,2fr)}#inspector{grid-column:2}}
@media(max-width:640px){main{grid-template-columns:minmax(0,1fr);padding:12px}#inspector{grid-column:auto}.stack{max-height:245px}}
</style>
<header><h1>Pull request impact explorer</h1><p id="summary"></p><p><code id="revisions"></code></p></header>
<main>
<section class="panel" aria-labelledby="packages-title"><h2 id="packages-title">Packages</h2><label class="sr" for="search">Find a file or package</label><input id="search" type="search" placeholder="Find a file or package"><div id="packages" class="list stack"></div></section>
<section class="panel" id="workspace" aria-label="Package and dependency view"></section>
<section class="panel" id="inspector" aria-label="Diff and evidence"></section>
</main>
<noscript>This report needs JavaScript to display the package map.</noscript>
<script type="application/json" id="report">__REPORT_DATA__</script>
<script>
"use strict";
const data = JSON.parse(document.querySelector("#report").textContent);
const byId = id => document.getElementById(id);
function el(tag, text, className) {
  const node = document.createElement(tag);
  if (text != null) node.textContent = text;
  if (className) node.className = className;
  return node;
}
function control(text, action, current = false) {
  const button = el("button", text);
  button.type = "button";
  if (current) button.setAttribute("aria-current", "true");
  button.addEventListener("click", action);
  return button;
}
function section(parent, title) {
  const target = el("div", null, "row");
  target.append(el("h3", title));
  parent.append(target);
  return target;
}
function page(list, items, draw, batch = 12) {
  let index = 0;
  function append() {
    const end = Math.min(index + batch, items.length);
    for (; index < end; index++) list.append(draw(items[index]));
    if (index < items.length) {
      const more = control(`Show more (${items.length - index} remaining)`, () => {
        const previous = more.previousElementSibling;
        more.remove();
        append();
        previous?.nextElementSibling?.focus();
      });
      list.append(more);
    }
  }
  append();
}
const packages = new Map();
const links = new Map();
const adjacent = data.files.map(() => ({incoming: [], outgoing: []}));
for (const [index, file] of data.files.entries()) {
  if (!packages.has(file.group)) packages.set(file.group, []);
  packages.get(file.group).push(index);
}
for (const [index, edge] of data.edges.entries()) {
  const [source, target] = edge;
  adjacent[source].outgoing.push(index);
  adjacent[target].incoming.push(index);
  const from = data.files[source].group;
  const to = data.files[target].group;
  if (from === to) continue;
  if (!links.has(from)) links.set(from, new Map());
  const targets = links.get(from);
  if (!targets.has(to)) targets.set(to, []);
  targets.get(to).push(index);
}
const groups = [...packages.keys()];
const countChanged = ids => ids.filter(i => data.files[i].status).length;
groups.sort((a, b) => countChanged(packages.get(b)) - countChanged(packages.get(a)) || a.localeCompare(b));
let group = groups[0];
let selected;
let direction = "both";
byId("summary").textContent = `${data.changed} changed · ${data.files.length - data.changed} related · ${groups.length} packages`;
byId("revisions").textContent = `${data.base} → ${data.head}`;
const labels = {A:"Added", M:"Modified", D:"Deleted", T:"Type changed"};
function fileButton(i) {
  const file = data.files[i];
  const button = control(null, () => openFile(i), i === selected);
  button.append(el("span", file.path, "path"), document.createElement("br"),
    el("span", labels[file.status] || (file.status ? "Changed" : "Related"), `tag ${file.status}`));
  return button;
}
function openFile(i) {
  selected = i;
  group = data.files[i].group;
  rebuild();
  byId("file-title").focus();
}
function openGroup(name) {
  group = name;
  selected = undefined;
  rebuild();
  byId("group-title").focus();
}
function renderPackages() {
  const list = byId("packages");
  list.replaceChildren();
  const term = byId("search").value.trim().toLowerCase();
  if (term) {
    const results = data.files.flatMap((file, i) =>
      file.path.toLowerCase().includes(term) || file.group.toLowerCase().includes(term) ? [i] : []);
    if (!results.length) list.append(el("p", "No matching files or packages.", "muted"));
    page(list, results, fileButton);
    return;
  }
  function packageButton(name) {
    const ids = packages.get(name);
    const changed = countChanged(ids);
    const button = control(null, () => openGroup(name), name === group);
    button.append(el("span", name, "package-name"), el("small", `${changed} changed · ${ids.length - changed} related`));
    return button;
  }
  const changedGroups = groups.filter(name => countChanged(packages.get(name)));
  const relatedGroups = groups.filter(name => !countChanged(packages.get(name)));
  page(list, changedGroups, packageButton);
  if (relatedGroups.length) {
    const details = el("details");
    details.append(el("summary", `Related packages (${relatedGroups.length})`));
    const items = el("div", null, "list row");
    details.append(items);
    details.open = relatedGroups.includes(group);
    details.addEventListener("toggle", () => {
      if (details.open && !items.childElementCount) page(items, relatedGroups, packageButton);
    });
    list.append(details);
  }
}
function showEvidence(indices) {
  const evidence = byId("evidence");
  evidence.replaceChildren(el("h3", "Relationship evidence"));
  const list = el("div", null, "list");
  page(list, indices, i => {
    const [source, target, line, kind, revision, excerpt] = data.edges[i];
    const row = el("div", null, `edge ${revision === "base only" ? "removed" : ""}`);
    row.append(el("div", `${data.files[source].path}:${line}`, "path"),
      el("div", `${kind} → ${data.files[target].path}`, "path"),
      el("small", revision === "base only" ? "Base revision only" : "Head revision"));
    if (excerpt) row.append(el("div", excerpt, "path"));
    return row;
  });
  evidence.append(list);
  evidence.focus();
}
function renderWorkspace() {
  const view = byId("workspace");
  view.replaceChildren();
  const title = el("h2", group || "No changed files");
  title.id = "group-title";
  title.tabIndex = -1;
  view.append(title);
  if (!group) return;
  const ids = packages.get(group);
  const changed = ids.filter(i => data.files[i].status);
  const related = ids.filter(i => !data.files[i].status);
  const fileList = section(view, "Changed files");
  const list = el("div", null, "list");
  fileList.append(list);
  if (!changed.length) list.append(el("p", "This package contains related files.", "muted"));
  page(list, changed, fileButton);
  if (related.length) {
    const disclosure = el("details", null, "row");
    disclosure.append(el("summary", `Related files (${related.length})`));
    const relatedList = el("div", null, "list row");
    disclosure.append(relatedList);
    disclosure.addEventListener("toggle", () => {
      if (disclosure.open && !relatedList.childElementCount) page(relatedList, related, fileButton);
    });
    if (related.includes(selected)) disclosure.open = true;
    view.append(disclosure);
  }
  if (selected === undefined) {
    const connections = [];
    for (const [from, targets] of links) {
      for (const [to, edges] of targets) if (from === group || to === group) connections.push([from, to, edges]);
    }
    connections.sort((a, b) => b[2].length - a[2].length);
    if (connections.length) {
      const lane = el("div", null, "list");
      section(view, "Package connections").append(lane);
      page(lane, connections, ([from, to, edges]) => control(
        `${from} → ${to} · ${edges.length} references`, () => showEvidence(edges)));
    }
    return;
  }
  const heading = section(view, "Direct file connections");
  const select = el("select");
  select.setAttribute("aria-label", "Connection direction");
  for (const [value, text] of [["both","Both directions"],["incoming","Dependents"],["outgoing","Dependencies"]]) {
    const option = el("option", text);
    option.value = value;
    select.append(option);
  }
  select.value = direction;
  const connectionLists = el("div");
  function updateConnections() {
    direction = select.value;
    connectionLists.replaceChildren();
    for (const [key, label, other] of [["incoming","Dependents → selected file",0],["outgoing","Selected file → dependencies",1]]) {
      if (direction !== "both" && direction !== key) continue;
      const neighbors = new Map();
      for (const index of adjacent[selected][key]) {
        const file = data.edges[index][other];
        if (!neighbors.has(file)) neighbors.set(file, []);
        neighbors.get(file).push(index);
      }
      const lane = el("div", null, "list");
      section(connectionLists, `${label} (${neighbors.size})`).append(lane);
      if (!neighbors.size) lane.append(el("p", "No matching references.", "muted"));
      page(lane, [...neighbors], ([file, edges]) => {
        const row = el("div", null, "edge");
        row.append(fileButton(file), control(`Show evidence · ${edges.length}`, () => showEvidence(edges)));
        return row;
      });
    }
  }
  heading.append(select, connectionLists);
  select.addEventListener("change", updateConnections);
  updateConnections();
}
function renderInspector() {
  const view = byId("inspector");
  view.replaceChildren();
  const title = el("h2", "Diff and evidence");
  title.id = "file-title";
  title.tabIndex = -1;
  view.append(title);
  const evidence = el("div");
  evidence.id = "evidence";
  evidence.tabIndex = -1;
  view.append(evidence);
  if (selected === undefined) {
    view.append(el("p", "Select a file or a package connection to inspect it.", "muted"));
  } else {
    const file = data.files[selected];
    view.append(el("p", file.path, "path"));
    if (file.diff) {
      const pre = el("pre");
      const code = el("code");
      const fragment = document.createDocumentFragment();
      for (const line of file.diff.split("\n")) {
        const cls = line.startsWith("@@") ? "hunk" : line.startsWith("+") && !line.startsWith("+++") ? "add" :
          line.startsWith("-") && !line.startsWith("---") ? "del" : "";
        fragment.append(el("span", line || " ", `diff-line ${cls}`));
      }
      code.append(fragment);
      pre.append(code);
      view.append(pre);
    } else view.append(el("p", "No diff for this file.", "muted"));
  }
  if (data.notes.length) {
    const details = el("details", null, "row");
    details.append(el("summary", `Analysis diagnostics (${data.notes.length})`));
    for (const [path, line, reason] of data.notes) details.append(el("p", `${path}:${line} · ${reason}`, "path"));
    view.append(details);
  }
}
function rebuild() { renderPackages(); renderWorkspace(); renderInspector(); }
byId("search").addEventListener("input", renderPackages);
rebuild();
</script>
</html>
