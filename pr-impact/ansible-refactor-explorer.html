<!doctype html>
<html lang="en">
<meta charset="utf-8">

<style>
:root{--ink:#18253b;--muted:#526178;--paper:#f1f4f8;--rule:#d8e0eb;--accent:#15545e;--selected:#e4f3f2;--mono:"IBM Plex Mono",ui-monospace,monospace}

.list{display:grid;gap:6px}.list button{width:100%}.stack{max-height:390px;overflow:auto;padding:3px}.package-name{font-weight:700;display:block}.muted,small{color:var(--muted)}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input{width:100%;margin:8px 0;padding:8px 10px;border:1px solid var(--rule);border-radius:7px}select{max-width:100%}.row{margin-top:10px}.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:#e7effb;color:#244d7b}.tag.M,.tag.T{background:#ffedc7;color:#6a4300}.tag.A{background:#d9f3e5;color:#205c40}.tag.D{background:#fbe0e0;color:#8a3033}
pre{overflow:auto;max-height:510px;background:#f5f7fa;padding:10px;border-radius:8px;font-size:12px;tab-size:4}.diff-line{display:block}.add{background:#e0f3e7}.del{background:#fbe1e1}.hunk{color:#245a91}.edge{display:block;border-left:3px solid #5f969b;padding:6px 9px;margin-bottom:6px;background:#f2f7f8}.edge.removed{border-left-style:dashed}.edge button{margin-top:4px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:980px){main{grid-template-columns:minmax(180px,1fr) minmax(240px,2fr)}#inspector{grid-column:2}}
@media(max-width:640px){main{grid-template-columns:minmax(0,1fr);padding:12px}#inspector{grid-column:auto}.stack{max-height:245px}}
</style>

</main>

result type.\"\"\"\n+\n+    def get_attributes(self) -> dict[str, str]:\n+        \"\"\"Return a dictionary of attributes for this instance.\"\"\"\n+        return _attributes(\n+            message=self.message,\n+            type=self.type,\n+        )\n+\n+    def get_xml_element(self) -> ET.Element:\n+        \"\"\"Return an XML element representing this instance.\"\"\"\n+        element = ET.Element(self.tag, self.get_attributes())\n+        element.text = self.output\n+\n+        return element\n+\n+\n+@dataclasses.dataclass\n+class TestFailure(TestResult):\n+    \"\"\"Failure info for a test case.\"\"\"\n+\n+    @property\n+    def tag(self) -> str:\n+        \"\"\"Tag name for the XML element created by this result type.\"\"\"\n+        return 'failure'\n+\n+\n+@dataclasses.dataclass\n+class TestError(TestResult):\n+    \"\"\"Error info for a test case.\"\"\"\n+\n+    @property\n+    def tag(self) -> str:\n+        \"\"\"Tag name for the XML element created by this result type.\"\"\"\n+        return 'error'\n+\n+\n+@dataclasses.dataclass\n+class TestCase:\n+    \"\"\"An individual test case.\"\"\"\n+\n+    name: str\n+    assertions: int | None = None\n+    classname: str | None = None\n+    status: str | None = None\n+    time: decimal.Decimal | None = None\n+\n+    errors: list[TestError] = dataclasses.field(default_factory=list)\n+    failures: list[TestFailure] = dataclasses.field(default_factory=list)\n+    skipped: str | None = None\n+    system_out: str | None = None\n+    system_err: str | None = None\n+\n+    is_disabled: bool = False\n+\n+    @property\n+    def is_failure(self) -> bool:\n+        \"\"\"True if the test case contains failure info.\"\"\"\n+        return bool(self.failures)\n+\n+    @property\n+    def is_error(self) -> bool:\n+        \"\"\"True if the test case contains error info.\"\"\"\n+        return bool(self.errors)\n+\n+    @property\n+    def is_skipped(self) -> bool:\n+        \"\"\"True if the test case was skipped.\"\"\"\n+        return bool(self.skipped)\n+\n+    def get_attributes(self) -> dict[str, str]:\n+        \"\"\"Return a dictionary of attributes for this instance.\"\"\"\n+        return _attributes(\n+            assertions=self.assertions,\n+            classname=self.classname,\n+            name=self.name,\n+            status=self.status,\n+            time=self.time,\n+        )\n+\n+    def get_xml_element(self) -> ET.Element:\n+        \"\"\"Return an XML element representing this instance.\"\"\"\n+        element = ET.Element('testcase', self.get_attributes())\n+\n+        if self.skipped:\n+            ET.SubElement(element, 'skipped').text = self.skipped\n+\n+        element.extend([error.get_xml_element() for error in self.errors])\n+        element.extend([failure.get_xml_element() for failure in self.failures])\n+\n+        if self.system_out:\n+            ET.SubElement(element, 'system-out').text = self.system_out\n+\n+        if self.system_err:\n+            ET.SubElement(element, 'system-err').text = self.system_err\n+\n+        return element\n+\n+\n+@dataclasses.dataclass\n+class TestSuite:\n+    \"\"\"A collection of test cases.\"\"\"\n+\n+    name: str\n+    hostname: str | None = None\n+    id: str | None = None\n+    package: str | None = None\n+    timestamp: datetime.datetime | None = None\n+\n+    properties: dict[str, str] = dataclasses.field(default_factory=dict)\n+    cases: list[TestCase] = dataclasses.field(default_factory=list)\n+    system_out: str | None = None\n+    system_err: str | None = None\n+\n+    def __post_init__(self):\n+        if self.timestamp and self.timestamp.tzinfo != datetime.timezone.utc:\n+            raise ValueError(f'timestamp.tzinfo must be {datetime.timezone.utc!r}')\n+\n+    @property\n+    def disabled(self) -> int:\n+        \"\"\"The number of disabled test cases.\"\"\"\n+        return sum(case.is_disabled for case in self.cases)\n+\n+    @property\n+    def errors(self) -> int:\n+        \"\"\"The number of test cases containing error info.\"\"\"\n+        return sum(case.is_error for case in self.cases)\n+\n+    @property\n+    def failures(self) -> int:\n+        \"\"\"The number of test cases containing failure info.\"\"\"\n+        return sum(case.is_failure for case in self.cases)\n+\n+    @property\n+    def skipped(self) -> int:\n+        \"\"\"The number of test cases containing skipped info.\"\"\"\n+        return sum(case.is_skipped for case in self.cases)\n+\n+    @property\n+    def tests(self) -> int:\n+        \"\"\"The number of test cases.\"\"\"\n+        return len(self.cases)\n+\n+    @property\n+    def time(self) -> decimal.Decimal:\n+        \"\"\"The total time from all test cases.\"\"\"\n+        return decimal.Decimal(sum(case.time for case in self.cases if case.time))\n+\n+    def get_attributes(self) -> dict[str, str]:\n+        \"\"\"Return a dictionary of attributes for this instance.\"\"\"\n+        return _attributes(\n+            disabled=self.disabled,\n+            errors=self.errors,\n+            failures=self.failures,\n+            hostname=self.hostname,\n+            id=self.id,\n+            name=self.name,\n+            package=self.package,\n+            skipped=self.skipped,\n+            tests=self.tests,\n+            time=self.time,\n+            timestamp=self.timestamp.replace(tzinfo=None).isoformat(timespec='seconds') if self.timestamp else None,\n+        )\n+\n+    def get_xml_element(self) -> ET.Element:\n+        \"\"\"Return an XML element representing this instance.\"\"\"\n+        element = ET.Element('testsuite', self.get_attributes())\n+\n+        if self.properties:\n+            ET.SubElement(element, 'properties').extend([ET.Element('property', dict(name=name, value=value)) for name, value in self.properties.items()])\n+\n+        element.extend([test_case.get_xml_element() for test_case in self.cases])\n+\n+        if self.system_out:\n+            ET.SubElement(element, 'system-out').text = self.system_out\n+\n+        if self.system_err:\n+            ET.SubElement(element, 'system-err').text = self.system_err\n+\n+        return element\n+\n+\n+@dataclasses.dataclass\n+class TestSuites:\n+    \"\"\"A collection of test suites.\"\"\"\n+\n+    name: str | None = None\n+\n+    suites: list[TestSuite] = dataclasses.field(default_factory=list)\n+\n+    @property\n+    def disabled(self) -> int:\n+        \"\"\"The number of disabled test cases.\"\"\"\n+        return sum(suite.disabled for suite in self.suites)\n+\n+    @property\n+    def errors(self) -> int:\n+        \"\"\"The number of test cases containing error info.\"\"\"\n+        return sum(suite.errors for suite in self.suites)\n+\n+    @property\n+    def failures(self) -> int:\n+        \"\"\"The number of test cases containing failure info.\"\"\"\n+        return sum(suite.failures for suite in self.suites)\n+\n+    @property\n+    def tests(self) -> int:\n+        \"\"\"The number of test cases.\"\"\"\n+        return sum(suite.tests for suite in self.suites)\n+\n+    @property\n+    def time(self) -> decimal.Decimal:\n+        \"\"\"The total time from all test cases.\"\"\"\n+        return decimal.Decimal(sum(suite.time for suite in self.suites))\n+\n+    def get_attributes(self) -> dict[str, str]:\n+        \"\"\"Return a dictionary of attributes for this instance.\"\"\"\n+        return _attributes(\n+            disabled=self.disabled,\n+            errors=self.errors,\n+            failures=self.failures,\n+            name=self.name,\n+            tests=self.tests,\n+            time=self.time,\n+        )\n+\n+    def get_xml_element(self) -> ET.Element:\n+        \"\"\"Return an XML element representing this instance.\"\"\"\n+        element = ET.Element('testsuites', self.get_attributes())\n+        element.extend([suite.get_xml_element() for suite in self.suites])\n+\n+        return element\n+\n+    def to_pretty_xml(self) -> str:\n+        \"\"\"Return a pretty formatted XML string representing this instance.\"\"\"\n+        return _pretty_xml(self.get_xml_element())\n+\n+\n+def _attributes(**kwargs) -> dict[str, str]:\n+    \"\"\"Return the given kwargs as a dictionary with values converted to strings. Items with a value of None will be omitted.\"\"\"\n+    return {key: str(value) for key, value in kwargs.items() if value is not None}\n+\n+\n+def _pretty_xml(element: ET.Element) -> str:\n+    \"\"\"Return a pretty formatted XML string representing the given element.\"\"\"\n+    return minidom.parseString(ET.tostring(element, encoding='unicode')).toprettyxml()\n"}, {"path": "lib/ansible/cli/__init__.py", "group": "lib/ansible/cli", "status": "M", "diff": "diff --git a/lib/ansible/cli/__init__.py b/lib/ansible/cli/__init__.py\nindex 843e639..9bfa07f 100644\n--- a/lib/ansible/cli/__init__.py\n+++ b/lib/ansible/cli/__init__.py\n@@ -116,7 +116,7 @@ from ansible.parsing.vault import PromptVaultSecret, get_file_vault_secret, Vaul\n from ansible.plugins.loader import add_all_plugin_dirs, init_plugin_loader\n from ansible.release import __version__\n from ansible.utils.collection_loader import AnsibleCollectionConfig\n-from ansible.utils.collection_loader._collection_finder import _get_collection_name_from_path\n+from ansible.module_utils._internal._collection_loader._collection_finder import _get_collection_name_from_path\n from ansible.utils.path import unfrackpath\n from ansible.vars.manager import VariableManager\n from ansible.module_utils._internal import _deprecator\n"}, {"path": "lib/ansible/cli/doc.py", "group": "lib/ansible/cli", "status": "M", "diff": "diff --git a/lib/ansible/cli/doc.py b/lib/ansible/cli/doc.py\nindex 4bae104..ed1dcb2 100755\n--- a/lib/ansible/cli/doc.py\n+++ b/lib/ansible/cli/doc.py\n@@ -40,7 +40,7 @@ from ansible._internal._yaml._loader import AnsibleInstrumentedLoader\n from ansible.plugins.list import _list_plugins_with_info, _PluginDocMetadata\n from ansible.plugins.loader import action_loader, fragment_loader\n from ansib t(resource.RLIMIT_NOFILE, (requested_soft, existing_hard))\n+            except ValueError:\n+                # some platforms (eg macOS) lie about their hard limit\n+                pass\n+\n+    import sys\n+    import __main__\n+\n+    # For some distros and python versions we pick up this script in the temporary\n+    # directory.  This leads to problems when the ansible module masks a python\n+    # library that another import needs.  We have not figured out what about the\n+    # specific distros and python versions causes this to behave differently.\n+    #\n+    # Tested distros:\n+    # Fedora23 with python3.4  Works\n+    # Ubuntu15.10 with python2.7  Works\n+    # Ubuntu15.10 with python3.4  Fails without this\n+    # Ubuntu16.04.1 with python3.5  Fails without this\n+    # To test on another platform:\n+    # * use the copy module (since this shadows the stdlib copy module)\n+    # * Turn off pipelining\n+    # * Make sure that the destination file does not exist\n+    # * ansible ubuntu16-test -m copy -a 'src=/etc/motd dest=/var/tmp/m'\n+    # This will traceback in shutil.  Looking at the complete traceback will show\n+    # that shutil is importing copy which finds the ansible module instead of the\n+    # stdlib module\n+    scriptdir = None\n+    try:\n+        scriptdir = os.path.dirname(os.path.realpath(__main__.__file__))\n+    except (AttributeError, OSError):\n+        # Some platforms don't set __file__ when reading from stdin\n+        # OSX raises OSError if using abspath() in a directory we don't have\n+        # permission to read (realpath calls abspath)\n+        pass\n+\n+    # Strip cwd from sys.path to avoid potential permissions issues\n+    excludes = {'', '.', scriptdir}\n+    sys.path = [p for p in sys.path if p not in excludes]\n+\n+    import base64\n+    import shutil\n+    import tempfile\n+    import zipfile\n+\n+    def invoke_module(modlib_path: str, json_params: bytes) -> None:\n+        # When installed via setuptools (including python setup.py install),\n+        # ansible may be installed with an easy-install.pth file.  That file\n+        # may load the system-wide install of ansible rather than the one in\n+        # the module.  sitecustomize is the only way to override that setting.\n+        z = zipfile.ZipFile(modlib_path, mode='a')\n+\n+        # py3: modlib_path will be text, py2: it's bytes.  Need bytes at the end\n+        sitecustomize = 'import sys\\nsys.path.insert(0, \"%s\")\\n' % modlib_path\n+        sitecustomize = sitecustomize.encode('utf-8')\n+        # Use a ZipInfo to work around zipfile limitation on hosts with\n+        # clocks set to a pre-1980 year (for instance, Raspberry Pi)\n+        zinfo = zipfile.ZipInfo()\n+        zinfo.filename = 'sitecustomize.py'\n+        zinfo.date_time = date_time.utctimetuple()[:6]\n+        z.writestr(zinfo, sitecustomize)\n+        z.close()\n+\n+        # Put the zipped up module_utils we got from the controller first in the python path so that we\n+        # can monkeypatch the right basic\n+        sys.path.insert(0, modlib_path)\n+\n+        from ansible.module_utils._internal._ansiballz import _loader\n+\n+        _loader.run_module(\n+            json_params=json_params,\n+            profile=profile,\n+            module_fqn=module_fqn,\n+            modlib_path=modlib_path,\n+            extensions=extensions,\n+            secrets=secrets,\n+        )\n+\n+    def debug(command: str, modlib_path: str, json_params: bytes) -> None:\n+        # The code here normally doesn't run.  It's only used for debugging on the\n+        # remote machine.\n+        #\n+        # The subcommands in this function make it easier to debug ansiballz\n+        # modules.  Here's the basic steps:\n+        #\n+        # Run ansible with the environment variable: ANSIBLE_KEEP_REMOTE_FILES=1 and -vvv\n+        # to save the module file remotely::\n+        #   $ ANSIBLE_KEEP_REMOTE_FILES=1 ansible host1 -m ping -a 'data=october' -vvv\n+        #\n+        # Part of the verbose output will tell you where on the remote machine the\n+        # module was written to::\n+        #   [...]\n+        #   \u003chost1> SSH: EXEC ssh -C -q -o ControlMaster=auto -o ControlPersist=60s -o KbdInteractiveAuthentication=no -o\n+        #   PreferredAuthentications=gssapi-with-mic,gssapi-keyex,hostbased,publickey -o PasswordAuthentication=no -o ConnectTimeout=10 -o\n+        #   ControlPath=/home/badger/.ansible/cp/ansible-ssh-%h-%p-%r -tt rhel7 '/bin/sh -c '\"'\"'LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8\n+        #   LC_MESSAGES=en_US.UTF-8 /usr/bin/python /home/badger/.ansible/tmp/ansible-tmp-1461173013.93-9076457629738/ping'\"'\"''\n+        #   [...]\n+        #\n+        # Login to the remote machine and run the module file via from the previous\n+        # step with the explode subcommand to extract the module payload into\n+        # source files::\n+        #   $ ssh host1\n+        #   $ /usr/bin/python /home/badger/.ansible/tmp/ansible-tmp-1461173013.93-9076457629738/ping explode\n+        #   Module expanded into:\n+        #   /home/badger/.ansible/tmp/ansible-tmp-1461173408.08-279692652635227/ansible\n+        #\n+        # You can now edit the source files to instrument the code or experiment with\n+        # different parameter values.  When you're ready to run the code you've modified\n+        # (instead of the code from the actual zipped module), use the execute subcommand like this::\n+        #   $ /usr/bin/python /home/badger/.ansible/tmp/ansible-tmp-1461173013.93-9076457629738/ping execute\n+\n+        # Okay to use __file__ here because we're running from a kept file\n+        basedir = os.path.join(os.path.abspath(os.path.dirname(__file__)), 'debug_dir')\n+        args_path = os.path.join(basedir, 'args')\n+\n+        if command == 'explode':\n+            # transform the ZIPDATA into an exploded directory of code and then\n+            # print the path to the code.  This is an easy way for people to look\n+            # at the code on the remote machine for debugging it in that\n+            # environment\n+            z = zipfile.ZipFile(modlib_path)\n+            for filename in z.namelist():\n+                if filename.startswith('/'):\n+                    raise Exception('Something wrong with this module zip file: should not contain absolute paths')\n+\n+                dest_filename = os.path.join(basedir, filename)\n+                if dest_filename.endswith(os.path.sep) and not os.path.exists(dest_filename):\n+                    os.makedirs(dest_filename)\n+                else:\n+                    directory = os.path.dirname(dest_filename)\n+                    if not os.path.exists(directory):\n+                        os.makedirs(directory)\n+                    with open(dest_filename, 'wb') as writer:\n+                        writer.write(z.read(filename))\n+\n+            # write the args file\n+            with open(args_path, 'wb') as writer:\n+                writer.write(json_params)\n+\n+            # pylint: disable=ansible-bad-function\n+            print('Module expanded into:')\n+            print(basedir)\n+\n+        elif command == 'execute':\n+            # Execute the exploded code instead of executing the module from the\n+            # embedded ZIPDATA.  This allows people to easily run their modified\n+            # code on the remote machine to see how changes will affect it.\n+\n+            # Set pythonpath to the debug dir\n+            sys.path.insert(0, basedir)\n+\n+            # read in the args file which the user may have modified\n+            with open(args_path, 'rb') as reader:\n+                json_params = reader.read()\n+\n+            from ansible.module_utils._internal._ansiballz import _loader\n+\n+            _loader.run_module(\n+                json_params=json_params,\n+                profile=profile,\n+                module_fqn=module_fqn,\n+                modlib_path=modlib_path,\n+                secrets=secrets,\n+                extensions=extensions,\n+            )\n+\n+        else:\n+            print(f'FATAL: Unknown debug command {command!r}. Doing nothing.')  # pylint: disable=ansible-bad-function\n+\n+    #\n+    # See comments in the debug() method for information on debugging\n+    #\n+\n+    encoded_params = params.encode()\n+\n+    # There's a race condition with the controller removing the\n+    # remote_tmpdir and this module executing under async.  So we cannot\n+    # store this in remote_tmpdir (use system tempdir instead)\n+    # Only need to use [ansible_module]_payload_ in the temp_path until we move to zipimport\n+    # (this helps ansible-test produce coverage stats)\n+    # IMPORTANT: The real path must be used here to ensure a remote debugger such as PyCharm (using pydevd) can resolve paths correctly.\n+    temp_path = os.path.realpath(tempfile.mkdtemp(prefix='ansible_' + ansible_module + '_payload_'))\n+\n+    try:\n+        zipped_mod = os.path.join(temp_path, 'ansible_' + ansible_module + '_payload.zip')\n+\n+        with open(zipped_mod, 'wb') as modlib:\n+            modlib.write(base64.b64decode(zip_data))\n+\n+        if len(sys.argv) == 2:\n+            debug(sys.argv[1], zipped_mod, encoded_params)\n+        else:\n+            invoke_module(zipped_mod, encoded_params)\n+    finally:\n+        shutil.rmtree(temp_path, ignore_errors=True)\n"}, {"path": "lib/ansible/module_utils/_internal/_collection_loader/__init__.py", "group": "lib/ansible/module_utils", "status": "A", "diff": "diff --git a/lib/ansible/module_utils/_internal/_collection_loader/__init__.py b/lib/ansible/module_utils/_internal/_collection_loader/__init__.py\nnew file mode 100644\nindex 0000000..9c5e9aa\n--- /dev/null\n+++ b/lib/ansible/module_utils/_internal/_collection_loader/__init__.py\n@@ -0,0 +1,69 @@\n+# (c) 2019 Ansible Project\n+# GNU General Public License v3.0+ (see COPYING or https://www.gnu.org/licenses/gpl-3.0.txt)\n+\n+# CAUTION: This implementation of the collection loader is used by ansible-test.\n+#          Because of this, it must be compatible with all Python versions supported on the controller or remote.\n+\n+from __future__ import annotations\n+\n+import typing as t\n+\n+\n+@t.runtime_checkable\n+class _EncryptedStringProtocol(t.Protocol):\n+    \"\"\"Protocol representing an `EncryptedString`, since it cannot be imported here.\"\"\"\n+\n+    # DTFIX-FUTURE: collapse this with the one in config, once we can\n+\n+    def _decrypt(self) -> str: ...\n+\n+\n+def _to_text(value: str | bytes | _EncryptedStringProtocol | None, strict: bool = False) -> str | None:\n+    \"\"\"Internal implementation to keep collection loader standalone.\"\"\"\n+    # FUTURE: remove this method when _to_bytes is removed\n+\n+    if value is None:\n+        return None\n+\n+    if isinstance(value, str):\n+        return value\n+\n+    if isinstance(value, bytes):\n+        return value.decode(errors='strict' if strict else 'surrogateescape')\n+\n+    if isinstance(value, _EncryptedStringProtocol):\n+        return value._decrypt()\n+\n+    raise TypeError(f'unsupported type {type(value)}')\n+\n+\n+def _to_bytes(value: str | bytes | _EncryptedStringProtocol | None, strict: bool = False) -> bytes | None:\n+    \"\"\"Internal implementation to keep collection loader standalone.\"\"\"\n+    # FUTURE: remove this method and rely on automatic str -> bytes conversions of filesystem methods instead\n+\n+    if value is None:\n+        return None\n+\n+    if isinstance(value, bytes):\n+        return value\n+\n+    if isinstance(value, str):\n+        return value.encode(errors='strict' if strict else 'surrogateescape')\n+\n+    if isinstance(value, _EncryptedStringProtocol):\n+        return value._decrypt().encode(errors='strict' if strict else 'surrogateescape')\n+\n+    raise TypeError(f'unsupported type {type(value)}')\n+\n+\n+def resource_from_fqcr(ref):\n+    \"\"\"\n+    Return resource from a fully-qualified collection reference,\n+    or from a simple resource name.\n+    For fully-qualified collection references, this is equivalent to\n+    ``AnsibleCollectionRef.from_fqcr(ref).resource``.\n+    :param ref: collection reference to parse\n+    :return: the resource as a unicode string\n+    \"\"\"\n+    ref = _to_text(ref, strict=True)\n+    return ref.split(u'.')[-1]\n"}, {"path": "lib/ansible/module_utils/_internal/_collection_loader/_collection_config.py", "group": "lib/ansible/module_utils", "status": "A", "diff": "diff --git a/lib/ansible/module_utils/_internal/_collection_loader/_collection_config.py b/lib/ansible/module_utils/_internal/_collection_loader/_collection_config.py\nnew file mode 100644\nindex 0000000..32f3594\n--- /dev/null\n+++ b/lib/ansible/module_utils/_internal/_collection_loader/_collection_config.py\n@@ -0,0 +1,107 @@\n+# (c) 2019 Ansible Project\n+# GNU General Public License v3.0+ (see COPYING or https://www.gnu.org/licenses/gpl-3.0.txt)\n+\n+# CAUTION: This implementation of the collection loader is used by ansible-test.\n+#          Because of this, it must be compatible with all Python versions supported on the controller or remote.\n+\n+from __future__ import annotations\n+\n+from . import _to_text\n+\n+\n+class _EventSource:\n+    def __init__(self):\n+        self._handlers = set()\n+\n+    def __iadd__(self, handler):\n+        if not callable(handler):\n+            raise ValueError('handler must be callable')\n+        self._handlers.add(handler)\n+        return self\n+\n+    def __isub__(self, handler):\n+        try:\n+            self._handlers.remove(handler)\n+        except KeyError:\n+            pass\n+\n+        return self\n+\n+    def _on_exception(self, handler, exc, *args, **kwargs):\n+        # if we return True, we want the caller to re-raise\n+        return True\n+\n+    def fire(self, *args, **kwargs):\n+        for h in self._handlers:\n+            try:\n+                h(*args, **kwargs)\n+            except Exception as ex:\n+                if self._on_exception(h, ex, *args, **kwargs):\n+                    raise\n+\n+\n+class _AnsibleCollectionConfig(type):\n+    def __init__(cls, meta, name, bases):\n+        cls._collection_finder = None\n+        cls._default_collection = None\n+        cls._on_collection_load = _EventSource()\n+\n+    @property\n+    def collection_finder(cls):\n+        return cls._collection_finder\n+\n+    @collection_finder.setter\n+    def collection_finder(cls, value):\n+        if cls._collection_finder:\n+            raise ValueError('an AnsibleCollectionFinder has already been configured')\n+\n+        cls._collection_finder = value\n+\n+    @property\n+    def collection_paths(cls):\n+        cls._require_finder()\n+        return [_to_text(p) for p in cls._collection_finder._n_collection_paths]\n+\n+    @property\n+    def _internal_collections(cls):\n+        cls._require_finder()\n+        return cls._collection_finder._internal_collections\n+\n+    @property\n+    def default_collection(cls):\n+        return cls._default_collection\n+\n+    @default_collection.setter\n+    def default_collection(cls, value):\n+\n+        cls._default_collection = value\n+\n+    @property\n+    def on_collection_load(cls):\n+        return cls._on_collection_load\n+\n+    @on_collection_load.setter\n+    def on_collection_load(cls, value):\n+        if value is not cls._on_collection_load:\n+            raise ValueError('on_collection_load is not directly settable (use +=)')\n+\n+    @property\n+    def playbook_paths(cls):\n+        cls._require_finder()\n+        return [_to_text(p) for p in cls._collection_finder._n_playbook_paths]\n+\n+    @playbook_paths.setter\n+    def playbook_paths(cls, value):\n+        cls._require_finder()\n+        cls._collection_finder.set_playbook_paths(value)\n+\n+    def _require_finder(cls):\n+        if not cls._collection_finder:\n+            raise NotImplementedError('an AnsibleCollectionFinder has not been installed in this process')\n+\n+\n+# concrete class of our metaclass type that defines the class properties we want\n+\n+\n+class AnsibleCollectionConfig(object, metaclass=_AnsibleCollectionConfig):\n+    pass\n"}, {"path": "lib/ansible/module_utils/_internal/_collection_loader/_collection_finder.py", "group": "lib/ansible/module_utils", "status": "A", "diff": "diff --git a/lib/ansible/module_utils/_internal/_collection_loader/_collection_finder.py b/lib/ansible/module_utils/_internal/_collection_loader/_collection_finder.py\nnew file mode 100644\nindex 0000000..4e57bab\n--- /dev/null\n+++ b/lib/ansible/module_utils/_internal/_collection_loader/_collection_finder.py\n@@ -0,0 +1,1305 @@\n+# (c) 2019 Ansible Project\n+# GNU General Public License v3.0+ (see COPYING or https://www.gnu.org/licenses/gpl-3.0.txt)\n+\n+# CAUTION: This implementation of the collection loader is used by ansible-test.\n+#          Because of this, it must be compatible with all Python versions supported on the controller or remote.\n+\n+from __future__ import annotations\n+\n+import inspect\n+import itertools\n+import os\n+import os.path\n+import pathlib\n+import re\n+import sys\n+\n+from contextlib import contextmanager\n+from importlib import import_module, reload as reload_module\n+from importlib.machinery import FileFinder\n+from importlib.util import find_spec, spec_from_loader\n+from keyword import iskeyword\n+from types import ModuleType\n+\n+# DO NOT add new non-stdlib import deps here, this loader is used by external tools (eg ansible-test import sanity)\n+# that only allow stdlib and module_utils\n+from . import _to_bytes, _to_text\n+from ._collection_config import AnsibleCollectionConfig\n+\n+try:\n+    # Available on Python >= 3.11\n+    # We ignore the import error that will trigger when running mypy with\n+    # older Python versions.\n+    from importlib.resources.abc import TraversableResources  # type: ignore[import]\n+except ImportError:\n+    # Used with Python 3.10 only\n+    # This member is still available as an alias up until Python 3.14 but\n+    # is deprecated as of Python 3.12.\n+    # deprecated: description='TraversableResources move' python_version='3.10'\n+    from importlib.abc import TraversableResources  # type: ignore[assignment,no-redef]\n+\n+# NB: this supports import sanity test providing a different impl\n+try:\n+    from ._collection_meta import _meta_yml_to_dict\n+except ImportError:\n+    _meta_yml_to_dict = None\n+\n+PB_EXTENSIONS = ('.yml', '.yaml')\n+SYNTHETIC_PACKAGE_NAME = '\u003cansible_synthetic_collection_package>'\n+\n+\n+class _AnsibleNSTraversable:\n+    \"\"\"Class that implements the ``importlib.resources.abc.Traversable``\n+    interface for the following ``ansible_collections`` namespace packages::\n+\n+    * ``ansible_collections``\n+    * ``ansible_collections.\u003cnamespace>``\n+\n+    These namespace packages operate differently from a normal Python\n+    namespace package, in that the same namespace can be distributed across\n+    multiple directories on the filesystem and still function as a single\n+    namespace, such as::\n+\n+    * ``/usr/share/ansible/collections/ansible_collections/ansible/posix/``\n+    * ``/home/user/.ansible/collections/ansible_collections/ansible/windows/``\n+\n+    This class will mimic the behavior of various ``pathlib.Path`` methods,\n+    by combining the results of multiple root paths into the output.\n+\n+    This class does not do anything to remove duplicate collections from the\n+    list, so when traversing either namespace patterns supported by this class,\n+    it is possible to have the same collection located in multiple root paths,\n+    but precedence rules only use one. When iterating or traversing these\n+    package roots, there is the potential to see the same collection in\n+    multiple places without indication of which would be used. In such a\n+    circumstance, it is best to then call ``importlib.resources.files`` for an\n+    individual collection package rather than continuing to traverse from the\n+    namespace package.\n+\n+    Several methods will raise ``NotImplementedError`` as they do not make\n+    sense for these namespace packages.\n+    \"\"\"\n+\n+    def __init__(self, *paths):\n+        self._paths = [pathlib.Path(p) for p in paths]\n+\n+    def __repr__(self):\n+        return \"_AnsibleNSTraversable('%s')\" % \"', '\".join(map(_to_text, self._paths))\n+\n+    def iterdir(self):\n+        return itertools.chain.from_iterable(p.iterdir() for p in self._paths if p.is_dir())\n+\n+    def is_dir(self):\n+        return any(p.is_dir() for p in self._paths)\n+\n+    def is_file(self):\n+        return False\n+\n+    def glob(self, pattern):\n+        return itertools.chain.from_iterable(p.glob(pattern) for p in self._paths if p.is_dir())\n+\n+    def _not_implemented(self, *args, **kwargs):\n+        raise NotImplementedError('not usable on namespaces')\n+\n+    joinpath = __truediv__ = read_bytes = read_text = _not_implemented\n+\n+\n+class _AnsibleTraversableResources(TraversableResources):\n+    \"\"\"Implements ``importlib.resources.abc.TraversableResources`` for the\n+    collection Python loaders.\n+\n+    The result of ``files`` will depend on whether a particular collection, or\n+    a sub package of a collection was referenced, as opposed to\n+    ``ansible_collections`` or a particular namespace. For a collection and\n+    its subpackages, a ``pathlib.Path`` instance will be returned, whereas\n+    for the higher level namespace packages, ``_AnsibleNSTraversable``\n+    will be returned.\n+    \"\"\"\n+\n+    def __init__(self, package, loader):\n+        self._package = package\n+        self._loader = loader\n+\n+    def _get_name(self, package):\n+        try:\n+            # spec\n+            return package.name\n+        except AttributeError:\n+            # module\n+            return package.__name__\n+\n+    def _get_package(self, package):\n+        try:\n+            # spec\n+            return package.__parent__\n+        except AttributeError:\n+            # module\n+            return package.__package__\n+\n+    def _get_path(self, package):\n+        try:\n+            # spec\n+            return package.origin\n+        except AttributeError:\n+            # module\n+            return package.__file__\n+\n+    def _is_ansible_ns_package(self, package):\n+        origin = getattr(package, 'origin', None)\n+        if not origin:\n+            return False\n+\n+        if origin == SYNTHETIC_PACKAGE_NAME:\n+            return True\n+\n+        module_filename = os.path.basename(origin)\n+        return module_filename in {'__synthetic__', '__init__.py'}\n+\n+    def _ensure_package(self, package):\n+        if self._is_ansible_ns_package(package):\n+            # Short circuit our loaders\n+            return\n+        if self._get_package(package) != package.__name__:\n+            raise TypeError('%r is not a package' % package.__name__)\n+\n+    def files(self):\n+        package = self._package\n+        parts = package.split('.')\n+        is_ns = parts[0] == 'ansible_collections' and len(parts) \u003c 3\n+\n+        if isinstance(package, str):\n+            if is_ns:\n+                # Don't use ``spec_from_loader`` here, because that will point\n+                # to exactly 1 location for a namespace. Use ``find_spec``\n+                # to get a list of all locations for the namespace\n+                package = find_spec(package)\n+            else:\n+                package = spec_from_loader(package, self._loader)\n+        elif not isinstance(package, ModuleType):\n+            raise TypeError('Expected string or module, got %r' % package.__class__.__name__)\n+\n+        self._ensure_package(package)\n+        if is_ns:\n+            return _AnsibleNSTraversable(*package.submodule_search_locations)\n+        return pathlib.Path(self._get_path(package)).parent\n+\n+\n+class _AnsibleCollectionFinder:\n+    def __init__(self, paths=None, scan_sys_paths=True, internal_collections=None):\n+        # TODO: accept metadata loader override\n+        self._ansible_pkg_path = _to_text(os.path.dirname(_to_bytes(sys.modules['ansible'].__file__)))\n+\n+        if isinstance(paths, str):\n+            paths = [paths]\n+        elif paths is None:\n+            paths = []\n+\n+        # expand any placeholders in configured paths\n+        paths = [os.path.expanduser(_to_text(p)) for p in paths]\n+\n+        # add syspaths if needed\n+        if scan_sys_paths:\n+            paths.extend(sys.path)\n+\n+        good_paths = []\n+        # expand any placeholders in configured paths\n+        for p in paths:\n+\n+            # ensure we always have ansible_collections\n+            if os.path.basename(p) == 'ansible_collections':\n+                p = os.path.dirname(p)\n+\n+            if p not in good_paths and os.path.isdir(_to_bytes(os.path.join(p, 'ansible_collections'))):\n+                good_paths.append(p)\n+\n+        self._internal_collections = internal_collections\n+        self._n_configured_paths = good_paths\n+        self._n_cached_collection_paths = None\n+        self._n_cached_collection_qualified_paths = None\n+\n+        self._n_playbook_paths = []\n+\n+    @classmethod\n+    def _find_existing_finder(cls) -> _AnsibleCollectionFinder | None:\n+        for finder in sys.meta_path:\n+            if isinstance(finder, _AnsibleCollectionFinder):\n+                return finder\n+\n+        return None\n+\n+    @classmethod\n+    def _remove(cls):\n+        for mps in sys.meta_path:\n+            if isinstance(mps, _AnsibleCollectionFinder):\n+                sys.meta_path.remove(mps)\n+\n+        # remove any path hooks that look like ours\n+        for ph in sys.path_hooks:\n+            if hasattr(ph, '__self__') and isinstance(ph.__self__, _AnsibleCollectionFinder):\n+                sys.path_hooks.remove(ph)\n+\n+        # zap any cached path importer cache entries that might refer to us\n+        sys.path_importer_cache.clear()\n+\n+        AnsibleCollectionConfig._collection_finder = None\n+\n+        # validate via the public property that we really killed it\n+        if AnsibleCollectionConfig.collection_finder is not None:\n+            raise AssertionError('_AnsibleCollectionFinder remove did not reset AnsibleCollectionConfig.collection_finder')\n+\n+    def _install(self):\n+        self._remove()\n+        sys.meta_path.insert(0, self)\n+\n+        sys.path_hooks.insert(0, self._ansible_collection_path_hook)\n+\n+        AnsibleCollectionConfig.collection_finder = self\n+\n+    def _ansible_collection_path_hook(self, path):\n+        path = _to_text(path)\n+        interesting_paths = self._n_cached_collection_qualified_paths\n+        if not interesting_paths:\n+            interesting_paths = []\n+            for p in self._n_collection_paths:\n+                if os.path.basename(p) != 'ansible_collections':\n+                    p = os.path.join(p, 'ansible_collections')\n+\n+                if p not in interesting_paths:\n+                    interesting_paths.append(p)\n+\n+            interesting_paths.insert(0, self._ansible_pkg_path)\n+            self._n_cached_collection_qualified_paths = interesting_paths\n+\n+        if any(path.startswith(p) for p in interesting_paths):\n+            return _AnsiblePathHookFinder(self, path)\n+\n+        raise ImportError('not interested')\n+\n+    @property\n+    def _n_collection_paths(self):\n+        paths = self._n_cached_collection_paths\n+        if not paths:\n+            self._n_cached_collection_paths = paths = self._n_playbook_paths + self._n_configured_paths\n+        return paths\n+\n+    def set_playbook_paths(self, playbook_paths):\n+        if isinstance(playbook_paths, str):\n+            playbook_paths = [playbook_paths]\n+\n+        # track visited paths; we have to preserve the dir order as-passed in case there are duplicate collections (first one wins)\n+        added_paths = set()\n+\n+        # de-dupe\n+        self._n_playbook_paths = [os.path.join(_to_text(p), 'collections') for p in playbook_paths if not (p in added_paths or added_paths.add(p))]\n+        self._n_cached_collection_paths = None\n+        # HACK: playbook CLI sets this relatively late, so we've already loaded some packages whose paths might depend on this. Fix those up.\n+        # NB: this should NOT be used for late additions; ideally we'd fix the playbook dir setup earlier in Ansible init\n+        # to prevent this from occurring\n+        for pkg in ['ansible_collections', 'ansible_collections.ansible']:\n+            self._reload_hack(pkg)\n+\n+    def _reload_hack(self, fullname):\n+        m = sys.modules.get(fullname)\n+        if not m:\n+            return\n+        reload_module(m)\n+\n+    def _get_loader(self, fullname, path=None):\n+        split_name = fullname.split('.')\n+        toplevel_pkg = split_name[0]\n+        module_to_find = split_name[-1]\n+        part_count = len(split_name)\n+\n+        if toplevel_pkg not in ['ansible', 'ansible_collections']:\n+            # not interested in anything other than ansible_collections (and limited cases under ansible)\n+            return None\n+\n+        # sanity check what we're getting from import, canonicalize path values\n+        if part_count == 1:\n+            if path:\n+                raise ValueError('path should not be specified for top-level packages (trying to find {0})'.format(fullname))\n+            else:\n+                # seed the path to the configured collection roots\n+                path = self._n_collection_paths\n+\n+        if part_count > 1 and path is None:\n+            raise ValueError('path must be specified for subpackages (trying to find {0})'.format(fullname))\n+\n+        if toplevel_pkg == 'ansible':\n+            # something under the ansible package, delegate to our internal loader in case of redirections\n+            initialize_loader = _AnsibleInternalRedirectLoader\n+        elif part_count == 1:\n+            initialize_loader = _AnsibleCollectionRootPkgLoader\n+        elif part_count == 2:  # ns pkg eg, ansible_collections, ansible_collections.somens\n+            initialize_loader = _AnsibleCollectionNSPkgLoader\n+        elif part_count == 3:  # collection pkg eg, ansible_collections.somens.somecoll\n+            initialize_loader = _AnsibleCollectionPkgLoader\n+        else:\n+            # anything below the collection\n+            initialize_loader = _AnsibleCollectionLoader\n+\n+        # NB: actual \"find\"ing is delegated to the constructors on the various loaders; they'll ImportError if not found\n+        try:\n+            return initialize_loader(fullname=fullname, path_list=path)\n+        except ImportError:\n+            # TODO: log attempt to load context\n+            return None\n+\n+    def find_module(self, fullname, path=None):\n+        # Figure out what's being asked for, and delegate to a special-purpose loader\n+        return self._get_loader(fullname, path)\n+\n+    def find_spec(self, fullname, path, target=None):\n+        loader = self._get_loader(fullname, path)\n+\n+        if loader is None:\n+            return None\n+\n+        spec = spec_from_loader(fullname, loader)\n+        if spec is not None and hasattr(loader, '_subpackage_search_paths'):\n+            spec.submodule_search_locations = loader._subpackage_search_paths\n+        return spec\n+\n+\n+# Implements a path_hook finder for iter_modules (since it's only path based). This finder does not need to actually\n+# function as a finder in most cases, since our meta_path finder is consulted first for *almost* everything, except\n+# pkgutil.iter_modules, and under py2, pkgutil.get_data if the parent package passed has not been loaded yet.\n+class _AnsiblePathHookFinder:\n+    def __init__(self, collection_finder, pathctx):\n+        # when called from a path_hook, find_module doesn't usually get the path arg, so this provides our context\n+        self._pathctx = _to_text(pathctx)\n+        self._collection_finder = collection_finder\n+        # cache the native FileFinder (take advantage of its filesystem cache for future find/load requests)\n+        self._file_finder = None\n+\n+    # class init is fun- this method has a self arg that won't get used\n+    def _get_filefinder_path_hook(self=None):\n+        _file_finder_hook = None\n+        # try to find the FileFinder hook to call for fallback path-based imports in Py3\n+        _file_finder_hook = [ph for ph in sys.path_hooks if 'FileFinder' in repr(ph)]\n+        if len(_file_finder_hook) != 1:\n+            raise Exception('need exactly one FileFinder import hook (found {0})'.format(len(_file_finder_hook)))\n+        _file_finder_hook = _file_finder_hook[0]\n+\n+        return _file_finder_hook\n+\n+    _filefinder_path_hook = _get_filefinder_path_hook()\n+\n+    def _get_finder(self, fullname):\n+        split_name = fullname.split('.')\n+        toplevel_pkg = split_name[0]\n+\n+        if toplevel_pkg == 'ansible_collections':\n+            # collections content? delegate to the collection finder\n+            return self._collection_finder\n+        else:\n+            # Something else; we'd normally restrict this to `ansible` descendent modules so that any weird loader\n+            # behavior that arbitrary Python modules have can be serviced by those loaders. In some dev/test\n+            # scenarios (eg a venv under a collection) our path_hook signs us up to load non-Ansible things, and\n+            # it's too late by the time we've reached this point, but also too expensive for the path_hook to figure\n+            # out what we *shouldn't* be loading with the limited info it has. So we'll just delegate to the\n+            # normal path-based loader as best we can to service it. This also allows us to take advantage of Python's\n+            # built-in FS caching and byte-compilation for <script>
"use strict";
const data = JSON.parse(document.querySelector("#report").textContent);
const byId = id => document.getElementById(id);
function el(tag, text, className) {
  const node = document.createElement(tag);
  if (text != null) node.textContent = text;
  if (className) node.className = className;
  return node;
}
function control(text, action, current = false) {
  const button = el("button", text);
  button.type = "button";
  if (current) button.setAttribute("aria-current", "true");
  button.addEventListener("click", action);
  return button;
}
function section(parent, title) {
  const target = el("div", null, "row");
  target.append(el("h3", title));
  parent.append(target);
  return target;
}
function page(list, items, draw, batch = 12) {
  let index = 0;
  function append() {
    const end = Math.min(index + batch, items.length);
    for (; index < end; index++) list.append(draw(items[index]));
    if (index < items.length) {
      const more = control(`Show more (${items.length - index} remaining)`, () => {
        const previous = more.previousElementSibling;
        more.remove();
        append();
        previous?.nextElementSibling?.focus();
      });
      list.append(more);
    }
  }
  append();
}
const packages = new Map();
const links = new Map();
const adjacent = data.files.map(() => ({incoming: [], outgoing: []}));
for (const [index, file] of data.files.entries()) {
  if (!packages.has(file.group)) packages.set(file.group, []);
  packages.get(file.group).push(index);
}
for (const [index, edge] of data.edges.entries()) {
  const [source, target] = edge;
  adjacent[source].outgoing.push(index);
  adjacent[target].incoming.push(index);
  const from = data.files[source].group;
  const to = data.files[target].group;
  if (from === to) continue;
  if (!links.has(from)) links.set(from, new Map());
  const targets = links.get(from);
  if (!targets.has(to)) targets.set(to, []);
  targets.get(to).push(index);
}
const groups = [...packages.keys()];
const countChanged = ids => ids.filter(i => data.files[i].status).length;
groups.sort((a, b) => countChanged(packages.get(b)) - countChanged(packages.get(a)) || a.localeCompare(b));
let group = groups[0];
let selected;
let direction = "both";
byId("summary").textContent = `${data.changed} changed · ${data.files.length - data.changed} related · ${groups.length} packages`;
byId("revisions").textContent = `${data.base} → ${data.head}`;
const labels = {A:"Added", M:"Modified", D:"Deleted", T:"Type changed"};
function fileButton(i) {
  const file = data.files[i];
  const button = control(null, () => openFile(i), i === selected);
  button.append(el("span", file.path, "path"), document.createElement("br"),
    el("span", labels[file.status] || (file.status ? "Changed" : "Related"), `tag ${file.status}`));
  return button;
}
function openFile(i) {
  selected = i;
  group = data.files[i].group;
  rebuild();
  byId("file-title").focus();
}
function openGroup(name) {
  group = name;
  selected = undefined;
  rebuild();
  byId("group-title").focus();
}
function renderPackages() {
  const list = byId("packages");
  list.replaceChildren();
  const term = byId("search").value.trim().toLowerCase();
  if (term) {
    const results = data.files.flatMap((file, i) =>
      file.path.toLowerCase().includes(term) || file.group.toLowerCase().includes(term) ? [i] : []);
    if (!results.length) list.append(el("p", "No matching files or packages.", "muted"));
    page(list, results, fileButton);
    return;
  }
  function packageButton(name) {
    const ids = packages.get(name);
    const changed = countChanged(ids);
    const button = control(null, () => openGroup(name), name === group);
    button.append(el("span", name, "package-name"), el("small", `${changed} changed · ${ids.length - changed} related`));
    return button;
  }
  const changedGroups = groups.filter(name => countChanged(packages.get(name)));
  const relatedGroups = groups.filter(name => !countChanged(packages.get(name)));
  page(list, changedGroups, packageButton);
  if (relatedGroups.length) {
    const details = el("details");
    details.append(el("summary", `Related packages (${relatedGroups.length})`));
    const items = el("div", null, "list row");
    details.append(items);
    details.open = relatedGroups.includes(group);
    details.addEventListener("toggle", () => {
      if (details.open && !items.childElementCount) page(items, relatedGroups, packageButton);
    });
    list.append(details);
  }
}
function showEvidence(indices) {
  const evidence = byId("evidence");
  evidence.replaceChildren(el("h3", "Relationship evidence"));
  const list = el("div", null, "list");
  page(list, indices, i => {
    const [source, target, line, kind, revision, excerpt] = data.edges[i];
    const row = el("div", null, `edge ${revision === "base only" ? "removed" : ""}`);
    row.append(el("div", `${data.files[source].path}:${line}`, "path"),
      el("div", `${kind} → ${data.files[target].path}`, "path"),
      el("small", revision === "base only" ? "Base revision only" : "Head revision"));
    if (excerpt) row.append(el("div", excerpt, "path"));
    return row;
  });
  evidence.append(list);
  evidence.focus();
}
function renderWorkspace() {
  const view = byId("workspace");
  view.replaceChildren();
  const title = el("h2", group || "No changed files");
  title.id = "group-title";
  title.tabIndex = -1;
  view.append(title);
  if (!group) return;
  const ids = packages.get(group);
  const changed = ids.filter(i => data.files[i].status);
  const related = ids.filter(i => !data.files[i].status);
  const fileList = section(view, "Changed files");
  const list = el("div", null, "list");
  fileList.append(list);
  if (!changed.length) list.append(el("p", "This package contains related files.", "muted"));
  page(list, changed, fileButton);
  if (related.length) {
    const disclosure = el("details", null, "row");
    disclosure.append(el("summary", `Related files (${related.length})`));
    const relatedList = el("div", null, "list row");
    disclosure.append(relatedList);
    disclosure.addEventListener("toggle", () => {
      if (disclosure.open && !relatedList.childElementCount) page(relatedList, related, fileButton);
    });
    if (related.includes(selected)) disclosure.open = true;
    view.append(disclosure);
  }
  if (selected === undefined) {
    const connections = [];
    for (const [from, targets] of links) {
      for (const [to, edges] of targets) if (from === group || to === group) connections.push([from, to, edges]);
    }
    connections.sort((a, b) => b[2].length - a[2].length);
    if (connections.length) {
      const lane = el("div", null, "list");
      section(view, "Package connections").append(lane);
      page(lane, connections, ([from, to, edges]) => control(
        `${from} → ${to} · ${edges.length} references`, () => showEvidence(edges)));
    }
    return;
  }
  const heading = section(view, "Direct file connections");
  const select = el("select");
  select.setAttribute("aria-label", "Connection direction");
  for (const [value, text] of [["both","Both directions"],["incoming","Dependents"],["outgoing","Dependencies"]]) {
    const option = el("option", text);
    option.value = value;
    select.append(option);
  }
  select.value = direction;
  const connectionLists = el("div");
  function updateConnections() {
    direction = select.value;
    connectionLists.replaceChildren();
    for (const [key, label, other] of [["incoming","Dependents → selected file",0],["outgoing","Selected file → dependencies",1]]) {
      if (direction !== "both" && direction !== key) continue;
      const neighbors = new Map();
      for (const index of adjacent[selected][key]) {
        const file = data.edges[index][other];
        if (!neighbors.has(file)) neighbors.set(file, []);
        neighbors.get(file).push(index);
      }
      const lane = el("div", null, "list");
      section(connectionLists, `${label} (${neighbors.size})`).append(lane);
      if (!neighbors.size) lane.append(el("p", "No matching references.", "muted"));
      page(lane, [...neighbors], ([file, edges]) => {
        const row = el("div", null, "edge");
        row.append(fileButton(file), control(`Show evidence · ${edges.length}`, () => showEvidence(edges)));
        return row;
      });
    }
  }
  heading.append(select, connectionLists);
  select.addEventListener("change", updateConnections);
  updateConnections();
}
function renderInspector() {
  const view = byId("inspector");
  view.replaceChildren();
  const title = el("h2", "Diff and evidence");
  title.id = "file-title";
  title.tabIndex = -1;
  view.append(title);
  const evidence = el("div");
  evidence.id = "evidence";
  evidence.tabIndex = -1;
  view.append(evidence);
  if (selected === undefined) {
    view.append(el("p", "Select a file or a package connection to inspect it.", "muted"));
  } else {
    const file = data.files[selected];
    view.append(el("p", file.path, "path"));
    if (file.diff) {
      const pre = el("pre");
      const code = el("code");
      const fragment = document.createDocumentFragment();
      for (const line of file.diff.split("\n")) {
        const cls = line.startsWith("@@") ? "hunk" : line.startsWith("+") && !line.startsWith("+++") ? "add" :
          line.startsWith("-") && !line.startsWith("---") ? "del" : "";
        fragment.append(el("span", line || " ", `diff-line ${cls}`));
      }
      code.append(fragment);
      pre.append(code);
      view.append(pre);
    } else view.append(el("p", "No diff for this file.", "muted"));
  }
  if (data.notes.length) {
    const details = el("details", null, "row");
    details.append(el("summary", `Analysis diagnostics (${data.notes.length})`));
    for (const [path, line, reason] of data.notes) details.append(el("p", `${path}:${line} · ${reason}`, "path"));
    view.append(details);
  }
}
function rebuild() { renderPackages(); renderWorkspace(); renderInspector(); }
byId("search").addEventListener("input", renderPackages);
rebuild();
</script>
